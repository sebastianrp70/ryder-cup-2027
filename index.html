<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ryder Cup 2027 Bote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: golf-app look from the reference. Light beige app ground, photo hero with centred title and pill, white rounded cards, dark band header with round month badges. Single light theme on purpose. */
:root{
  --bg:#ebeae4; --surface:#ffffff; --ink:#1b1c17; --muted:#7a7b72; --line:#ecebe5;
  --olive:#6e7f37; --olive-ink:#ffffff; --beige:#efeee7; --band:#2c2f27; --band-ink:#c9cbbf;
  --flag:#b3361e; --flag-soft:#f6e1da;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
header{position:relative;overflow:hidden;border-radius:28px;color:#fff;min-height:clamp(300px,40vw,420px);padding:32px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;
  background-color:#3a3d33;background-size:cover;background-position:60% 40%}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.28) 100%)}
header>*{position:relative}
.eyebrow{order:2;display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 22px;border-radius:999px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}
h1{order:1;font-family:var(--display);font-weight:400;font-size:clamp(48px,9vw,96px);line-height:.92;margin:0;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.3)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.5vw,38px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
section{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.scroll{overflow-x:auto;border-radius:24px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--band-ink);background:var(--band);padding:14px 6px;border-bottom:0}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.card th:first-child,.card td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-left:18px}
.card th.m{text-align:center}
.mb{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--band-ink);line-height:1.05}
.mb b{display:block;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:0;color:#fff}
.mb.now{background:var(--olive)}
.mb.past{background:transparent;opacity:.55}
.card thead th:first-child{background:var(--band);color:var(--band-ink);padding-left:18px}
.card td.cell{text-align:center;padding:8px 3px}
[hidden]{display:none!important}
#log th:first-child,#log td:first-child{padding-left:18px}
header{min-height:clamp(380px,62vw,620px)!important}
.panel{background:var(--surface);border-radius:28px;overflow:hidden;gap:0}
.panel .scroll{border-radius:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:26px 22px 20px}
.ph h2{font-size:clamp(30px,5vw,44px);line-height:1}
.pill{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:var(--beige);color:var(--muted)}
.pill:empty{display:none}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,clamp(180px,24vw,280px));gap:14px}
.g{border-radius:28px;background-color:#3a3d33;background-size:cover;background-position:center}
.g-links{grid-row:1 / span 2}
.g-bunker{grid-column:2 / span 2}
@media (max-width:620px){
  .gallery{grid-template-columns:1fr 1fr;grid-template-rows:200px 200px 180px}
  .g-links{grid-column:1;grid-row:1 / span 2}
  .g-bunker{grid-column:1 / span 2;grid-row:3}
}

.who{display:flex;align-items:center;gap:10px;font-weight:600}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--beige);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.02em}
.pip{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:600;background:var(--surface);border:1.5px solid #dcdbd3;color:var(--muted)}
.pip.paid{background:var(--olive);border-color:var(--olive);color:var(--olive-ink)}
.pip.part{background:var(--beige);border-color:var(--olive);color:var(--olive)}
.pip.late{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:var(--beige);color:var(--ink)}
.chip.ok{background:var(--olive);color:var(--olive-ink)}
.chip.wait{background:var(--beige);color:var(--muted)}
.chip.bad{background:var(--flag-soft);color:var(--flag)}
.chip.out{background:var(--line);color:var(--muted)}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--beige)}
.card tfoot td:first-child{background:var(--beige)}
.empty{padding:26px 18px;color:var(--muted);text-align:center}
footer{font-size:13px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Ryder Cup 2027</h1>
  </header>

  <section class="panel">
    <div class="ph"><h2>Tarjeta de pagos</h2></div>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const P = D.plan;
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const eur = n => n==null ? '—' : '€' + Number(n).toLocaleString('es-ES',{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2});
  const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDate = iso => { const [y,m,d] = iso.split('-').map(Number); return d+' '+MES[m-1]+' '+y; };
  const monthLabel = ym => { const [y,m] = ym.split('-').map(Number); return MES[m-1]+" '"+String(y).slice(2); };
  const lastDay = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0, 23, 59, 59); };

  const initials = n => n.replace(/[.\-]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
  const today = new Date();
  const topup = Math.round((P.total - P.monthly*P.months.length)*100)/100;
  // Instalment slots: one per month, then the top-up
  const slots = P.months.map(ym => ({key:ym, label:monthLabel(ym), amount:P.monthly, due:lastDay(ym)}));
  if (topup > 0) { const [y,m,d] = P.topupDue.split('-').map(Number); slots.push({key:'topup', label:P.topupLabel, amount:topup, due:new Date(y,m-1,d,23,59,59)}); }
  const firstDue = slots[0].due;
  const curKey = (() => { const ym = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0'); return P.months.includes(ym) ? ym : null; })();

  // Players whose money is already in the account (Sebastian): count each instalment as paid once its month starts
  const autoPays = [];
  D.players.filter(p => p.autoMonthly).forEach(p => {
    P.months.forEach((ym, i) => {
      const [y,m] = ym.split('-').map(Number);
      if (today >= new Date(y, m-1, 1)) {
        const amt = P.monthly + (i === P.months.length-1 ? topup : 0);
        autoPays.push({date: ym + '-01', player: p.name, amount: amt, note: ''});
      }
    });
  });
  const allPays = [...D.payments, ...autoPays];
  const paidOf = name => allPays.filter(x => x.player === name).reduce((s,x) => s + Number(x.amount||0), 0);

  // Allocate each player's total to slots in order
  const rows = D.players.map(p => {
    const paid = paidOf(p.name);
    let left = paid;
    const cells = slots.map(s => {
      const got = Math.max(0, Math.min(s.amount, left)); left -= got;
      const state = got >= s.amount - 0.001 ? 'paid' : (today > s.due ? 'late' : (got > 0 ? 'part' : 'none'));
      return {got, state};
    });
    const dueToDate = slots.filter(s => today > s.due).reduce((s,x) => s + x.amount, 0);
    let status;
    if (p.status === 'out') status = 'out';
    else if (paid >= P.monthly) status = paid + 0.001 >= dueToDate ? 'ok' : 'behind';
    else status = today > firstDue ? 'unconfirmed' : 'pending';
    return {p, paid, cells, dueToDate, status, owed: Math.max(0, P.total - paid), credit: Math.max(0, paid - P.total)};
  });

  const active = rows.filter(r => r.status !== 'out' && r.status !== 'unconfirmed');
  const confirmed = rows.filter(r => r.status === 'ok' || r.status === 'behind');
  const collected = rows.reduce((s,r) => s + r.paid, 0);
  const expected = confirmed.reduce((s,r) => s + r.dueToDate, 0);
  const behind = rows.filter(r => r.status === 'behind');

  document.getElementById('eyebrow').textContent = D.trip;
  const totalBudget = confirmed.length * P.total;

  // Scorecard
  const chip = {ok:['ok','Al día'],behind:['bad','Atrasado'],pending:['wait','Pendiente'],unconfirmed:['bad','Sin confirmar'],out:['out','Fuera']};
  let h = '<thead><tr><th>Jugador</th>' + slots.map(s => { const now = s.key===curKey, past = today > s.due; const [a,b] = s.key==='topup' ? ['+'+Math.round(s.amount),'ajuste'] : [s.label.split(' ')[0], s.label.split(' ')[1]]; return `<th class="m"><span class="mb ${now?'now':past?'past':''}"><b>${a.toUpperCase()}</b>${b}</span></th>`; }).join('') + '<th class="r">Pagado</th><th class="r">Falta</th><th>Estado</th></tr></thead><tbody>';
  rows.forEach(r => {
    h += `<tr><td><span class="who">${esc(r.p.name)}</span></td>` + r.cells.map((c,i) => {
      const txt = c.got ? (c.got === slots[i].amount ? c.got : c.got.toFixed(c.got%1?2:0)) : (c.state === 'late' ? '0' : '·');
      return `<td class="cell"><span class="pip ${c.state==='none'?'':c.state}" title="${slots[i].label}: ${eur(c.got)} de ${eur(slots[i].amount)}">${txt}</span></td>`;
    }).join('') + `<td class="r num">${eur(r.paid)}</td><td class="r num">${r.credit ? '+' + eur(r.credit) : eur(r.owed)}</td><td><span class="chip ${chip[r.status][0]}">${chip[r.status][1]}</span></td></tr>`;
  });
  const colTotals = slots.map((s,i) => rows.reduce((t,r) => t + r.cells[i].got, 0));
  h += '</tbody><tfoot><tr><td>Total</td>' + colTotals.map(t => `<td class="cell num">${t ? eur(t) : '—'}</td>`).join('') + `<td class="r num">${eur(collected)}</td><td class="r num">${eur(rows.filter(r=>r.status!=='out').reduce((t,r)=>t+r.owed,0))}</td><td></td></tr></tfoot>`;
  document.getElementById('card').innerHTML = h;

  // Log
  function renderLog(entries){
    const pays = [...entries, ...autoPays].sort((a,b) => String(b.date).localeCompare(String(a.date)));
    document.getElementById('logcount').textContent = pays.length ? pays.length + ' movimientos' : '';
    document.getElementById('log').innerHTML = pays.length
      ? '<table><thead><tr><th>Fecha</th><th>Jugador</th><th class="r">Importe</th><th>Nota</th></tr></thead><tbody>' +
        pays.map(x => `<tr><td class="num">${fmtDate(x.date)}</td><td>${esc(x.player)}</td><td class="r num">${eur(x.amount)}</td><td class="muted">${esc(x.note)}</td></tr>`).join('') + '</tbody></table>'
      : '<div class="empty">Aún no hay transferencias registradas.</div>';
  }
  renderLog(D.payments);

})();
</script>
